<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ヒヤリハット横断調査デモ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F2F5F8; --surface:#FFFFFF; --surface-2:#F7F9FB; --surface-3:#EDF2F7;
  --ink:#1A2331; --ink-2:#4E6178; --ink-3:#7C8EA3;
  --line:#DCE4EC; --line-strong:#C3D0DC;
  --accent:#009EDE; --accent-deep:#0E7FB8; --navy:#33476A;
  --ok:#14805E; --warn:#B4690E; --crit:#B3342B;
  --s1:#0E7FB8; --s2:#C0690E;
  --shadow:0 1px 2px rgba(26,35,49,.06), 0 6px 20px rgba(26,35,49,.05);
  --ui:"BIZ UDPGothic","Yu Gothic UI","Hiragino Kaku Gothic ProN","Meiryo",system-ui,sans-serif;
  --body:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",system-ui,sans-serif;
  --mono:ui-monospace,"SFMono-Regular","Roboto Mono",Menlo,Consolas,"Noto Sans JP",monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F151D; --surface:#17202B; --surface-2:#1D2835; --surface-3:#233040;
    --ink:#E7EEF6; --ink-2:#A8BACD; --ink-3:#7A8CA0;
    --line:#2A3746; --line-strong:#3A4B5E;
    --accent:#3EBFF0; --accent-deep:#3AA0D2; --navy:#9FB4D6;
    --ok:#3FBF95; --warn:#D9A03E; --crit:#E3776C;
    --s1:#3AA0D2; --s2:#BC7E1E;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.28);
  }
}
:root[data-theme="dark"]{
  --bg:#0F151D; --surface:#17202B; --surface-2:#1D2835; --surface-3:#233040;
  --ink:#E7EEF6; --ink-2:#A8BACD; --ink-3:#7A8CA0;
  --line:#2A3746; --line-strong:#3A4B5E;
  --accent:#3EBFF0; --accent-deep:#3AA0D2; --navy:#9FB4D6;
  --ok:#3FBF95; --warn:#D9A03E; --crit:#E3776C;
  --s1:#3AA0D2; --s2:#BC7E1E;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.28);
}

body{background:var(--bg); color:var(--ink); font-family:var(--body); font-size:14px; line-height:1.75;
  -webkit-font-smoothing:antialiased;}
*{box-sizing:border-box;}

/* ---------- chrome ---------- */
.topbar{position:sticky; top:env(safe-area-inset-top,0px); z-index:30; background:var(--surface);
  border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px;
  padding:10px 20px;}
.brand{display:flex; align-items:baseline; gap:9px; font-family:var(--ui);}
.brand b{font-size:15px; letter-spacing:.02em; color:var(--ink);}
.brand span{font-size:11px; color:var(--ink-3); letter-spacing:.09em;}
.dot{width:9px; height:9px; border-radius:50%; background:var(--accent); flex:0 0 auto;
  box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);}
.tag{margin-left:auto; font-family:var(--ui); font-size:10.5px; letter-spacing:.12em;
  color:var(--ink-3); border:1px solid var(--line-strong); border-radius:3px; padding:2px 8px;}

.wrap{max-width:880px; margin:0 auto; padding-inline:20px; padding-block:28px 132px;}

/* ---------- prompt ---------- */
.promptbox{background:var(--surface); border:1px solid var(--line); border-radius:10px;
  box-shadow:var(--shadow); padding:18px 20px;}
.promptbox .who{font-family:var(--ui); font-size:11px; letter-spacing:.1em; color:var(--ink-3);
  display:flex; align-items:center; gap:8px; margin-bottom:9px;}
.promptbox .who::before{content:""; width:20px; height:20px; border-radius:4px;
  background:var(--surface-3); border:1px solid var(--line);}
.promptbox p{margin:0; font-size:15px; line-height:1.85;}
.caret{display:inline-block; width:2px; height:1em; background:var(--accent);
  vertical-align:-2px; animation:blink 1s step-end infinite;}
@keyframes blink{50%{opacity:0}}

/* ---------- agent trace ---------- */
.trace{margin-top:26px; position:relative;}
.trace::before{content:""; position:absolute; left:13px; top:6px; bottom:10px; width:2px;
  background:linear-gradient(var(--line-strong), transparent); border-radius:2px;}
.node{position:relative; padding-left:44px; margin-bottom:18px;}
.node::before{content:""; position:absolute; left:7px; top:12px; width:14px; height:14px;
  border-radius:50%; background:var(--surface); border:2px solid var(--line-strong);}
.node.live::before{border-color:var(--accent); box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 16%,transparent);}
.node.done::before{border-color:var(--accent-deep); background:var(--accent-deep);}

.kicker{font-family:var(--ui); font-size:11px; letter-spacing:.12em; color:var(--accent-deep);
  margin-bottom:6px;}
.card{background:var(--surface); border:1px solid var(--line); border-radius:9px; padding:14px 16px;}
.qbox{display:flex; align-items:stretch; border:1px solid var(--line-strong); border-radius:6px;
  background:var(--surface-2); overflow:hidden;}
.qbox .q{flex:1 1 auto; min-width:0; font-family:var(--mono); font-size:12.5px; line-height:1.7;
  color:var(--ink); padding:9px 11px; white-space:pre-wrap; word-break:break-all;}
.qbtn{flex:0 0 46px; border:0; border-left:1px solid var(--line-strong); background:var(--surface-3);
  color:var(--ink-2); display:grid; place-items:center; cursor:default; border-radius:0;
  transition:background .16s ease, color .16s ease, transform .1s ease;}
.qbtn svg{width:16px; height:16px; display:block;}
.qbtn.press{background:var(--accent-deep); color:#fff; transform:scale(.9);}
.qbtn.done{background:var(--accent-deep); color:#fff; transform:none;}
.caret2{display:inline-block; width:7px; height:1.05em; background:var(--accent); opacity:.85;
  vertical-align:-3px; margin-left:1px; animation:blink 1s step-end infinite;}
.filecard{display:flex; align-items:center; gap:13px; background:var(--surface);
  border:1px solid var(--line); border-radius:9px; padding:14px 16px; box-shadow:var(--shadow);}
.filecard .ic{flex:0 0 40px; height:48px; border-radius:5px; border:1px solid var(--line-strong);
  background:var(--surface-2); display:grid; place-items:center; font-family:var(--ui);
  font-size:10px; letter-spacing:.04em; color:var(--accent-deep); font-weight:700;}
.filecard .nm{font-family:var(--ui); font-size:13px; line-height:1.55; color:var(--ink);
  word-break:break-all;}
.filecard .mt{font-size:11.5px; color:var(--ink-3); margin-top:3px;}
.toc{list-style:none; margin:12px 0 0; padding:0; display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:4px 18px;}
.toc li{font-size:12px; color:var(--ink-2); padding:3px 0; border-bottom:1px dotted var(--line);}
.toc li b{font-family:var(--ui); color:var(--ink-3); font-weight:400; margin-right:7px;
  font-variant-numeric:tabular-nums;}
.scope{font-family:var(--ui); font-size:11.5px; color:var(--ink-2); margin-top:7px;}
.scope em{font-style:normal; color:var(--ink); border-bottom:1px solid var(--line-strong);}

.status{display:flex; align-items:center; gap:8px; margin-top:11px;
  font-family:var(--ui); font-size:12.5px; color:var(--ink-2);}
.spin{width:12px; height:12px; border-radius:50%; border:2px solid var(--line-strong);
  border-top-color:var(--accent); animation:spin .7s linear infinite; flex:0 0 auto;}
@keyframes spin{to{transform:rotate(360deg)}}
.hit{font-family:var(--ui); color:var(--ink); font-weight:700;}
.hit b{color:var(--accent-deep); font-size:15px; font-variant-numeric:tabular-nums;}

.docs{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px;}
.doc{display:inline-flex; align-items:center; gap:7px; max-width:100%;
  background:var(--surface-2); border:1px solid var(--line); border-radius:5px;
  padding:5px 9px; font-size:11.5px; color:var(--ink-2);}
.doc code{font-family:var(--mono); font-size:11px; color:var(--ink); white-space:nowrap;}
.doc.key{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));
  background:color-mix(in srgb,var(--accent) 7%,var(--surface));}
.doc .kind{font-family:var(--ui); font-size:9.5px; letter-spacing:.06em; color:var(--ink-3);
  border:1px solid var(--line-strong); border-radius:3px; padding:0 4px; flex:0 0 auto;}

.note{margin-top:10px; font-size:12.5px; color:var(--ink-2); line-height:1.8;}
.judge{margin-top:11px; padding:10px 13px; border-left:3px solid var(--accent);
  background:color-mix(in srgb,var(--accent) 5%,var(--surface-2));
  border-radius:0 6px 6px 0; font-size:13px; line-height:1.8;}
.judge .lbl{font-family:var(--ui); font-size:10.5px; letter-spacing:.1em; color:var(--accent-deep);
  display:block; margin-bottom:3px;}

/* ---------- distribution chart ---------- */
.chart{margin-top:12px; border:1px solid var(--line); border-radius:8px; background:var(--surface-2);
  padding:14px 14px 12px;}
.chart h4{font-family:var(--ui); font-size:12px; margin:0 0 2px; color:var(--ink);}
.chart .sub{font-size:11px; color:var(--ink-3); margin-bottom:12px;}
.legend{display:flex; gap:14px; flex-wrap:wrap; margin-bottom:10px; font-size:11.5px; color:var(--ink-2);}
.legend i{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px;
  vertical-align:-1px;}
.grid{display:grid; grid-template-columns:auto repeat(9,minmax(0,1fr)); gap:0 4px; align-items:center;
  min-width:420px;}
.gscroll{overflow-x:auto;}
.rowlab{font-family:var(--ui); font-size:11px; color:var(--ink-2); padding-right:10px; white-space:nowrap;}
.cell{height:34px; display:flex; align-items:center; justify-content:center; gap:3px;
  border-radius:4px; position:relative;}
.cell.on{background:color-mix(in srgb,var(--ink-3) 8%,transparent); cursor:default;}
.mk{width:10px; height:10px; border-radius:50%; box-shadow:0 0 0 2px var(--surface-2);}
.yr{font-family:var(--ui); font-size:10px; color:var(--ink-3); text-align:center;
  font-variant-numeric:tabular-nums; padding-top:4px;}
.mark{grid-column:5 / span 1; position:relative; height:0;}
.cutline{position:absolute; top:-78px; right:-4px; width:2px; height:78px;
  background:repeating-linear-gradient(var(--crit) 0 4px, transparent 4px 8px);}
.cutlab{margin-top:8px; font-size:11px; color:var(--crit); display:flex; gap:6px; align-items:flex-start;}
.cutlab::before{content:"▲"; font-size:8px; line-height:1.9;}
.tblview{margin-top:10px;}
.tblview summary{font-family:var(--ui); font-size:11px; color:var(--ink-2); cursor:pointer;}
.tip{position:fixed; z-index:60; pointer-events:none; opacity:0; transition:opacity .12s;
  background:var(--ink); color:var(--surface); font-size:11.5px; font-family:var(--ui);
  padding:5px 9px; border-radius:5px; white-space:nowrap;}
.tip.on{opacity:1;}

/* ---------- answer ---------- */
.done-bar{margin:26px 0 8px; font-family:var(--ui); font-size:12.5px; color:var(--ink-2);
  border-top:1px solid var(--line); padding-top:14px; line-height:1.9;}
.done-bar b{color:var(--ink);}
.done-bar .badge{display:inline-block; font-size:10.5px; letter-spacing:.1em; color:#fff;
  background:var(--accent-deep); border-radius:3px; padding:1px 8px; margin-right:10px;
  vertical-align:1px;}
.answer h2{font-family:var(--ui); font-size:19px; margin:34px 0 6px; color:var(--ink);
  text-wrap:balance; letter-spacing:.01em;}
.answer h3{font-family:var(--ui); font-size:14px; margin:28px 0 10px; color:var(--navy);
  padding-bottom:6px; border-bottom:1px solid var(--line); letter-spacing:.02em;}
.answer p{margin:0 0 12px;}
.lead{font-size:14.5px; line-height:1.95;}
.answer strong{font-weight:700; background:linear-gradient(transparent 62%, color-mix(in srgb,var(--accent) 20%,transparent) 62%);}
.tw{overflow-x:auto; border:1px solid var(--line); border-radius:8px; background:var(--surface);}
table{border-collapse:collapse; width:100%; font-size:12.5px; min-width:560px;}
th,td{text-align:left; padding:9px 12px; border-bottom:1px solid var(--line); vertical-align:top;}
th{font-family:var(--ui); font-weight:700; font-size:11.5px; color:var(--ink-2);
  background:var(--surface-2); letter-spacing:.04em; white-space:nowrap;}
tr:last-child td{border-bottom:none;}
td code{font-family:var(--mono); font-size:11.5px; white-space:nowrap;}
tr.hl td{background:color-mix(in srgb,var(--accent) 6%,var(--surface));}
.quote{border:1px solid var(--line); border-left:3px solid var(--navy); border-radius:0 8px 8px 0;
  background:var(--surface); padding:14px 18px; font-size:12.5px; line-height:1.9;}
.quote .src{font-family:var(--ui); font-size:10.5px; letter-spacing:.08em; color:var(--ink-3);
  display:block; margin-bottom:8px;}
.causes{display:grid; grid-template-columns:repeat(auto-fit,minmax(248px,1fr)); gap:10px;}
.cause{background:var(--surface); border:1px solid var(--line); border-radius:9px; padding:13px 15px;}
.cause .n{font-family:var(--ui); font-size:11px; letter-spacing:.06em; color:var(--accent-deep);
  margin-bottom:4px;}
.cause .t{font-family:var(--ui); font-size:13px; line-height:1.65; margin-bottom:8px;}
.cause .e{font-size:11.5px; color:var(--ink-2); line-height:1.7;}
.cause .e span{font-family:var(--ui); color:var(--ink-3);}
.cause.extra{border-style:dashed;}
.unknowns{list-style:none; padding:0; margin:0; display:grid; gap:8px;}
.unknowns li{background:var(--surface); border:1px solid var(--line); border-radius:7px;
  padding:10px 14px 10px 34px; position:relative; font-size:12.5px; line-height:1.8;}
.unknowns li::before{content:"?"; position:absolute; left:13px; top:10px; font-family:var(--ui);
  font-size:12px; color:var(--warn); font-weight:700;}
.foot{margin-top:30px; padding-top:16px; border-top:1px solid var(--line);
  font-size:11.5px; color:var(--ink-3); line-height:1.8;}

/* ---------- controls ---------- */
.controls{position:fixed; left:0; right:0; bottom:0; z-index:40; background:var(--surface);
  border-top:1px solid var(--line); padding:10px 20px calc(10px + env(safe-area-inset-bottom,0px));
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
.controls .bar{flex:1 1 180px; height:4px; border-radius:3px; background:var(--surface-3);
  overflow:hidden; min-width:120px;}
.controls .bar i{display:block; height:100%; width:0; background:var(--accent);
  transition:width .18s linear;}
button{font-family:var(--ui); font-size:12px; color:var(--ink); background:var(--surface-2);
  border:1px solid var(--line-strong); border-radius:6px; padding:6px 13px; cursor:pointer;
  line-height:1.6;}
button:hover{background:var(--surface-3);}
button:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
button[aria-pressed="true"]{background:var(--accent-deep); border-color:var(--accent-deep); color:#fff;}
.speeds{display:flex; gap:4px;}
.speeds button{padding:6px 9px; font-variant-numeric:tabular-nums;}
.clock{font-family:var(--ui); font-size:11.5px; color:var(--ink-3); font-variant-numeric:tabular-nums;
  white-space:nowrap;}

.rise{animation:rise .42s cubic-bezier(.2,.7,.3,1) both;}
@keyframes rise{from{opacity:0; transform:translateY(9px)} to{opacity:1; transform:none}}
@media (prefers-reduced-motion:reduce){
  .rise{animation:none}
  .spin{animation:none}
  .caret{animation:none}
}
@media (max-width:560px){
  .wrap{padding-block:20px 150px;}
  .node{padding-left:34px;}
  .trace::before{left:9px;}
  .node::before{left:3px;}
}
</style>
</head>
<body>


<header class="topbar">
  <span class="dot" aria-hidden="true"></span>
  <span class="brand"><b>Neuron</b><span>エージェント検索</span></span>
  <span class="tag">DEMO</span>
</header>

<main class="wrap">
  <section class="promptbox">
    <div class="who">生産技術部 第2グループ／AL-2ライン立ち上げ担当</div>
    <p id="prompt"></p>
  </section>
  <div class="trace" id="trace"></div>
  <div id="answer"></div>
</main>

<div class="controls">
  <button id="play" type="button">一時停止</button>
  <button id="restart" type="button">最初から</button>
  <div class="speeds" role="group" aria-label="再生速度">
    <button type="button" data-sp="1" aria-pressed="true">1x</button>
    <button type="button" data-sp="1.5" aria-pressed="false">1.5x</button>
    <button type="button" data-sp="2" aria-pressed="false">2x</button>
  </div>
  <div class="bar" role="progressbar" aria-label="再生の進行"><i id="prog"></i></div>
  <span class="clock" id="clock">0:00</span>
</div>
<div class="tip" id="tip" role="status"></div>

<script>
(function(){
"use strict";
var REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var PROMPT = "AL-2ラインの締結工程で、リワークでワークを一度治具から外して入れ直すと、締付本数のカウントがずれる可能性があるとの指摘が現場から出ています。過去の他ラインで、ネジ締付のポカヨケをすり抜けた事例や、本数カウントを誤った事例がないか調べてください。原因として考えられるものと、立ち上げ中の今のうちに確認すべきことを整理してください。";

var trace = document.getElementById("trace");
var answer = document.getElementById("answer");
var promptEl = document.getElementById("prompt");
var progEl = document.getElementById("prog");
var clockEl = document.getElementById("clock");
var playBtn = document.getElementById("play");
var tip = document.getElementById("tip");

promptEl.textContent = PROMPT;

/* ---------------- helpers ---------------- */
function el(tag, cls, html){
  var e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html != null) e.innerHTML = html;
  return e;
}
var stick = true;
window.addEventListener("scroll", function(){
  var atEnd = window.innerHeight + window.scrollY >= document.body.offsetHeight - 220;
  stick = atEnd;
}, {passive:true});
function follow(node){
  if(!stick) return;
  window.scrollTo({top: document.body.scrollHeight, behavior: REDUCED ? "auto" : "smooth"});
}
function appear(parent, node){
  if(!REDUCED) node.classList.add("rise");
  parent.appendChild(node);
  follow(node);
  return node;
}

/* ---------------- playback engine ---------------- */
var beats = [], total = 0, token = 0, paused = false, speed = 1, elapsed = 0;
function beat(delay, fn){ beats.push({d:delay, fn:fn}); total += delay; }
function wait(ms, my){
  return new Promise(function(res){
    var left = ms;
    (function tick(){
      if(my !== token) return;
      if(paused){ setTimeout(tick, 60); return; }
      var step = Math.min(60, left);
      left -= step * speed; elapsed += step * speed;
      paint();
      if(left <= 0) res(); else setTimeout(tick, step);
    })();
  });
}
function paint(){
  var p = Math.min(1, elapsed/total);
  progEl.style.width = (p*100).toFixed(1) + "%";
  var s = Math.round(elapsed/1000);
  clockEl.textContent = Math.floor(s/60) + ":" + String(s%60).padStart(2,"0");
}
async function run(){
  var my = ++token; elapsed = 0; paused = false;
  playBtn.textContent = "一時停止";
  trace.innerHTML = ""; answer.innerHTML = "";
  for(var i=0;i<beats.length;i++){
    await wait(beats[i].d, my);
    if(my !== token) return;
    beats[i].fn();
  }
  elapsed = total; paint();
  playBtn.textContent = "再生";
  paused = true;
}

/* ---------------- search node builder ---------------- */
var nodes = {};
function makeNode(id, kicker){
  var n = el("div","node live");
  n.appendChild(el("div","kicker", kicker));
  var card = el("div","card");
  n.appendChild(card);
  nodes[id] = {node:n, card:card};
  appear(trace, n);
  return nodes[id];
}
var GLASS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.4 15.4 21 21"/></svg>';
function addQuery(id, q, scope){
  var c = nodes[id].card;
  var box = el("div","qbox");
  var qt = el("div","q", q + '<span class="caret2"></span>');
  var btn = el("button","qbtn", GLASS);
  btn.type = "button"; btn.tabIndex = -1; btn.setAttribute("aria-hidden","true");
  box.appendChild(qt); box.appendChild(btn);
  nodes[id].btn = btn; nodes[id].qt = qt;
  c.appendChild(box);
  if(scope) c.appendChild(el("div","scope", "絞り込み： <em>"+scope+"</em>"));
  follow(c);
}
function addSearching(id){
  var c = nodes[id].card;
  var btn = nodes[id].btn, qt = nodes[id].qt;
  if(qt){ var cr = qt.querySelector(".caret2"); if(cr) cr.remove(); }
  if(btn){
    btn.classList.add("press");
    setTimeout(function(){ btn.classList.remove("press"); btn.classList.add("done"); }, 260);
  }
  var s = el("div","status");
  s.appendChild(el("span","spin"));
  s.appendChild(el("span",null,"検索中…"));
  nodes[id].status = s;
  c.appendChild(s); follow(c);
}
function addHits(id, text){
  var s = nodes[id].status;
  s.innerHTML = "";
