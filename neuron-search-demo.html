<title>Neuron ES エージェント検索イメージデモ</title>

<body>

     ここから下（<style> … <div class="nrn-demo"> … <script>）を

<style>
@import url('https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Roboto+Mono:wght@400;500&display=swap');

.nrn-demo{
  /* ---------- カラートークン（ここだけ変えれば全体を調整できます） ---------- */
  --nrn-blue:#009EDE;             /* ベース2：主役の背景色・シグナル */
  --nrn-blue-dp:#0079AF;          /* 背景グラデーションの深い側（文字の視認性用） */
  --nrn-blue-lt:#00ACE9;          /* 背景グラデーションの明るい側 */
  --nrn-blue-ink:#0E6FA8;         /* 淡い面の上で使う青文字 */
  --nrn-navy:#33476A;             /* ベース3：見出し・数値 */
  --nrn-pale:#E9F9FF;             /* ベース1：淡い面 */
  --nrn-window:#F1F8FC;           /* 画面の下地 */
  --nrn-accent:#F06522;           /* アクセント1：操作と現在地 */
  --nrn-accent-soft:#FAEFD8;      /* アクセント2：本文マーカー */
  --nrn-mono:#DDDFE1;             /* モノカラー：罫線 */
  --nrn-ink:#4D4D4D;              /* フォントカラー：本文 */
  --nrn-ink-sub:#6E7887;          /* 補助テキスト */
  --nrn-card:#FFFFFF;
  --nrn-radius:13px;

  max-width:720px;
  margin:0 auto;
  padding:16px 18px 13px;
  background:
    radial-gradient(95% 130% at 100% 105%, rgba(0,200,255,.45), transparent 62%),
    linear-gradient(145deg, var(--nrn-blue-dp) 0%, var(--nrn-blue) 62%, var(--nrn-blue-lt) 100%);
  border-radius:20px;
  font-family:'BIZ UDPGothic','BIZ UDPゴシック','Noto Sans JP','Hiragino Sans',-apple-system,BlinkMacSystemFont,sans-serif;
  color:var(--nrn-ink);
  position:relative;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
.nrn-demo *{box-sizing:border-box;}
/* ブラウザの表示領域に収める（拡大はしない） */
.nrn-fit{position:relative;width:100%;}
.nrn-demo{transform-origin:top center;}
.nrn-num{font-family:'Roboto Mono',ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums;}

/* ---------- ヘッダー（青地の上） ---------- */
.nrn-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:11px;padding:0 4px;}
.nrn-title{font-size:17px;font-weight:700;letter-spacing:.05em;margin:0;color:#fff;}
.nrn-sublabel{font-size:13.5px;font-weight:700;color:#fff;letter-spacing:.02em;}
.nrn-badge{
  margin-left:auto;font-size:11px;font-weight:700;color:#fff;
  border:1px solid rgba(255,255,255,.55);border-radius:999px;padding:3px 10px;
  letter-spacing:.08em;white-space:nowrap;
}

/* ---------- 画面（明るい下地） ---------- */
.nrn-window{
  background:var(--nrn-window);
  border-radius:16px;
  padding:15px;
  box-shadow:0 12px 34px rgba(0,60,95,.20);
}

/* ---------- 検索バー ---------- */
.nrn-bar{
  display:flex;align-items:center;gap:12px;
  background:var(--nrn-card);border:1px solid #E1E7EC;border-radius:var(--nrn-radius);
  padding:10px 10px 10px 14px;margin-top:13px;
  box-shadow:0 1px 2px rgba(20,60,90,.06);
  transition:border-color .3s ease, box-shadow .3s ease;
}
.nrn-demo.is-focus .nrn-bar{border-color:var(--nrn-blue);box-shadow:0 0 0 3px rgba(0,158,222,.18);}
.nrn-bar-ico{flex:none;color:var(--nrn-blue);display:flex;}
.nrn-qwrap{flex:1;min-width:0;display:flex;align-items:center;font-size:15.5px;line-height:1.55;color:var(--nrn-ink);font-weight:400;}
.nrn-q{white-space:pre-wrap;word-break:break-word;}
.nrn-q:empty::before{content:'質問を入力してください';color:#9AA3AE;font-weight:400;}
.nrn-caret{display:inline-block;width:2px;height:1.15em;background:var(--nrn-accent);margin-left:2px;vertical-align:-.18em;opacity:0;}
.nrn-demo.is-typing .nrn-caret{animation:nrn-blink 1s steps(1,end) infinite;}
@keyframes nrn-blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.nrn-btn{
  flex:none;border:0;border-radius:9px;background:var(--nrn-blue);color:#fff;
  font-family:inherit;font-size:14px;font-weight:700;letter-spacing:.1em;
  padding:9px 20px;cursor:default;transition:transform .18s ease, filter .18s ease;
}
.nrn-demo.is-press .nrn-btn{transform:scale(.94);filter:brightness(.92);}

/* ---------- 質問バブル（右揃え） ---------- */
.nrn-ask{display:flex;justify-content:flex-end;margin-bottom:12px;}
.nrn-ask-t{
  max-width:76%;background:#E3F3FB;border:1px solid #B7DFF2;
  border-radius:16px 16px 5px 16px;padding:12px 18px;
  font-size:17.5px;font-weight:700;line-height:1.55;color:var(--nrn-navy);
  box-shadow:0 3px 10px rgba(0,120,180,.10);
  opacity:0;transform:translateY(6px);
  transition:opacity .38s ease, transform .38s cubic-bezier(.2,.8,.3,1);
}
.nrn-ask.on .nrn-ask-t{opacity:1;transform:none;}

/* ---------- 再生コントロール ---------- */
.nrn-ctl{display:flex;align-items:center;gap:11px;flex-wrap:nowrap;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.30);border-radius:13px;padding:8px 12px;}
.nrn-scn{display:flex;align-items:center;gap:6px;flex:0 1 auto;min-width:0;}
.nrn-scn-label{font-size:11px;font-weight:700;letter-spacing:.08em;color:rgba(255,255,255,.92);white-space:nowrap;}
.nrn-scn-b{border:1px solid rgba(255,255,255,.38);background:rgba(255,255,255,.12);color:#fff;
  font-family:inherit;font-size:12px;font-weight:400;border-radius:999px;padding:5px 11px;cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;
  transition:background-color .2s ease, color .2s ease, border-color .2s ease;}
.nrn-scn-b:hover{background:rgba(255,255,255,.26);}
.nrn-scn-b.on{background:#fff;color:var(--nrn-navy);font-weight:700;border-color:#fff;}
.nrn-scn-b .n{font-family:'Roboto Mono',ui-monospace,monospace;font-size:11px;opacity:.7;margin-right:5px;}
.nrn-scn-b.on .n{opacity:.55;}
.nrn-ctl-div{flex:none;width:1px;height:20px;background:rgba(255,255,255,.3);}
.nrn-play{flex:none;width:32px;height:32px;border-radius:50%;border:0;cursor:pointer;
  background:var(--nrn-accent);color:#fff;display:flex;align-items:center;justify-content:center;
  transition:filter .15s ease, transform .15s ease;}
.nrn-play:hover{filter:brightness(1.07);}
.nrn-play:active{transform:scale(.94);}
.nrn-track{position:relative;flex:1 1 auto;min-width:70px;height:22px;cursor:pointer;touch-action:none;}
.nrn-rail{position:absolute;left:0;right:0;top:9px;height:4px;border-radius:2px;background:rgba(255,255,255,.35);}
.nrn-fill{position:absolute;left:0;top:9px;height:4px;border-radius:2px;background:var(--nrn-accent);width:0;}
.nrn-knob{position:absolute;top:5px;left:0;width:12px;height:12px;margin-left:-6px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(0,40,70,.35);}
.nrn-time{flex:none;font-size:11.5px;color:rgba(255,255,255,.95);
  font-family:'Roboto Mono',ui-monospace,monospace;white-space:nowrap;}
.nrn-sp{flex:none;display:flex;gap:5px;}
.nrn-sp button{border:1px solid rgba(255,255,255,.45);background:transparent;color:#fff;font-family:inherit;
  font-size:11.5px;font-weight:700;border-radius:999px;padding:4px 10px;cursor:pointer;
  transition:background-color .2s ease, color .2s ease;}
.nrn-sp button:hover{background:rgba(255,255,255,.2);}
.nrn-sp button.on{background:#fff;color:var(--nrn-navy);border-color:#fff;}
.nrn-demo :focus-visible{outline:2px solid #fff;outline-offset:2px;}
/* 一時停止中・頭出し中 */
.nrn-demo.is-paused *{animation-play-state:paused !important;}
.nrn-demo.is-seeking *{transition:none !important;animation:none !important;}

/* ---------- ステータス行 ---------- */
.nrn-status{position:relative;height:22px;margin:0 0 0;font-size:12.5px;color:var(--nrn-ink-sub);}
.nrn-status .nrn-row{position:absolute;left:0;top:0;right:0;opacity:0;transition:opacity .35s ease;}
.nrn-status .nrn-row1{display:flex;align-items:center;gap:8px;height:22px;}
.nrn-status .nrn-row2{display:block;line-height:22px;}
.nrn-status .nrn-row.on{opacity:1;}
.nrn-spin{width:12px;height:12px;border-radius:50%;flex:none;border:2px solid rgba(0,158,222,.25);border-top-color:var(--nrn-blue);animation:nrn-spin .7s linear infinite;}
@keyframes nrn-spin{to{transform:rotate(360deg)}}
.nrn-hit{color:var(--nrn-navy);font-weight:700;}

/* ---------- 回答カード ---------- */
.nrn-stage{margin-top:10px;}
.nrn-answer{
  background:var(--nrn-card);border:1px solid #E3E9ED;border-radius:var(--nrn-radius);
  padding:14px 18px 13px;box-shadow:0 6px 20px rgba(20,60,90,.10);
  opacity:.45;transition:opacity .5s ease, box-shadow .5s ease, border-color .5s ease;
}
.nrn-demo.is-searching .nrn-answer,
.nrn-demo.is-answered .nrn-answer{opacity:1;}
.nrn-demo.is-answered .nrn-answer{border-color:#BCE2F4;box-shadow:0 10px 26px rgba(0,120,180,.14);}
.nrn-demo.is-measuring .nrn-answer{visibility:hidden;}

.nrn-ans-head{display:flex;align-items:center;gap:10px;margin-bottom:9px;}

.nrn-ans-label{font-size:12px;font-weight:700;letter-spacing:.09em;color:var(--nrn-navy);}

.nrn-ansbody{position:relative;min-height:78px;}
.nrn-skel{position:absolute;inset:0;opacity:1;transition:opacity .35s ease;}
.nrn-demo.is-answered .nrn-skel{opacity:0;}
.nrn-skel i{display:block;height:11px;border-radius:6px;background:#E4E8EB;margin-bottom:14px;}
.nrn-skel i:nth-child(1){width:94%;}
.nrn-skel i:nth-child(2){width:80%;}
.nrn-skel i:nth-child(3){width:44%;}
.nrn-demo.is-searching .nrn-skel i{
  background:linear-gradient(90deg,#E4E8EB 0%,#F3F9FC 45%,#E4E8EB 90%);
  background-size:220% 100%;animation:nrn-sh 1.3s linear infinite;
}
@keyframes nrn-sh{from{background-position:110% 0}to{background-position:-110% 0}}

.nrn-ans-text{font-size:16px;line-height:1.85;letter-spacing:.01em;margin:0;color:var(--nrn-ink);font-weight:400;}
.nrn-mark{background:linear-gradient(transparent 60%, var(--nrn-accent-soft) 60%);padding-bottom:1px;font-style:normal;}

/* 見出し＋本文の2カラム項目（原因分析・対応策など） */
.nrn-item{display:grid;grid-template-columns:auto 1fr;gap:11px;align-items:start;margin-bottom:9px;}
.nrn-item:last-child{margin-bottom:0;}
.nrn-k{
  font-size:12px;font-weight:700;color:var(--nrn-navy);white-space:nowrap;
  background:var(--nrn-pale);border:1px solid #C7E6F4;border-radius:7px;padding:4px 10px;
  line-height:1.5;margin-top:3px;
}

/* 番号付きリスト */
.nrn-list{list-style:none;margin:0;padding:0;counter-reset:nrnli;}
.nrn-list li{counter-increment:nrnli;display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:baseline;margin-bottom:5px;}
.nrn-list li:last-child{margin-bottom:0;}
.nrn-list li::before{
  content:counter(nrnli);
  font-family:'Roboto Mono',ui-monospace,monospace;font-size:12px;font-weight:500;
  color:var(--nrn-blue-ink);text-align:center;
  border:1px solid #C7E6F4;border-radius:6px;background:var(--nrn-pale);line-height:20px;
}

.nrn-cites{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;padding-top:10px;border-top:1px solid transparent;transition:border-color .4s ease;}
.nrn-demo.is-answered .nrn-cites{border-top-color:var(--nrn-mono);}
.nrn-cite{
  display:inline-flex;align-items:center;gap:7px;
  font-size:11.5px;color:var(--nrn-ink-sub);
  background:var(--nrn-pale);border:1px solid #C7E6F4;border-radius:8px;padding:6px 10px;
  opacity:0;transform:translateY(4px);
  transition:opacity .3s ease, transform .3s ease;
}
.nrn-cite.on{opacity:1;transform:none;}
.nrn-cite b{font-weight:700;color:var(--nrn-navy);font-size:11px;}

/* ---------- 再生中のシナリオ表示（青地の上） ---------- */
.nrn-foot{position:relative;z-index:6;margin-top:8px;padding:0 2px;}

/* ---------- 拡大表示（スポットライト） ---------- */
.nrn-spot{position:absolute;inset:0;z-index:5;pointer-events:none;display:flex;align-items:center;justify-content:center;padding:24px;}

<script>
(function () {
  var root = document.getElementById('nrnDemo');
  if (!root) return;

  /* =========================================================
     シナリオ（3パターンを順番に再生）
     文言・出典・件数はここを書き換えるだけで差し替えできます。
     cycle を指定したパターンはその尺ぴったりに、
     指定しないパターンは回答の文字数に応じた尺になります。
     ========================================================= */
  var PATTERNS = [
    {
      query: 'X-200ラインの異音トラブル、過去の対応事例は？',
      label: '異音トラブル',
      hits: '18',
      cycle: 11000,           // ← 1つ目だけ尺を固定（PACE倍して使用）
      answer:
        '過去3年でX-200ラインの異音報告は7件。主因は駆動部ベアリングの摩耗（5件）で、' +
        '<em class="nrn-mark">給脂周期を500h→300hへ見直した2023年7月以降、同種の再発は発生していません。</em>',
      cites: [
        ['ファイルサーバー', '保全報告書_2023Q2.pdf'],
        ['SharePoint', '設備トラブル対応手順 v4'],
        ['Slack', '#設備保全 2023-07-12'],
        ['データベース', '故障履歴 X-200']
      ]
    },
    {
      query: 'ラインZ-12で異音発生、過去の類似対応事例は？',
      label: 'ラインZ-12',
      hits: '24',
      answer:
        '<div class="nrn-item"><span class="nrn-k">原因分析</span><span class="nrn-v">' +
        '軸受の摩耗と潤滑剤の不足が主な原因で、<em class="nrn-mark">潤滑剤補充チェックが点検リストに明記されていなかったこと</em>が問題となった事例がありました。' +
        '</span></div>' +
        '<div class="nrn-item"><span class="nrn-k">対応策</span><span class="nrn-v">' +
        '軸受を新品に交換し、潤滑剤を規定量まで補充。月次保全サイクルの変更を検討し、点検リストに項目が入っているかを確認します。' +
        '</span></div>',
      cites: [
        ['ファイルサーバー', '保全報告書_Z-12.pdf'],
        ["desknet's NEO", '設備点検スケジュール'],
        ['Slack', '#設備保全 2024-11-08'],
        ['データベース', '故障履歴 Z-12']
      ]
    },
    {
      query: 'プレテク触媒の研究報告から、有効に作用した結論の報告を一覧にして',
      label: 'プレテク触媒',
      hits: '31',
      answer:
        '<ol class="nrn-list">' +
        '<li>Negishi カップリング反応</li>' +
        '<li>Kumada–Tamao–Corriu クロスカップリング反応</li>' +
        '<li>Sonogashira 反応</li>' +
        '</ol>',
      cites: [
        ['文書管理システム', '触媒研究報告 2024年度'],
        ['Box', '実験ノート_Pd系触媒'],
        ['Google Drive', '学会発表資料_第58回'],
        ['データベース', '反応条件DB']
      ]
    }
  ];

  var LABEL_WAIT = '回答を生成しています…';
  var LABEL_DONE = 'エージェント検索の回答';

  /* ===== 速度調整（ミリ秒） ===== */
  var SPEED = {
    startPause:   660,   // 再生開始からプロンプトの拡大表示まで
    spotIn:       340,   // 拡大表示があらわれる時間
    spotOut:      600,   // 定位置に縮んで戻る時間
    holdQuery:   1100,   // 質問文を大きく見せている時間
    holdRepos:   1500,   // リポジトリを大きく見せている時間（ここだけ1.5倍）
    holdAnsBase: 1200,   // 回答を大きく見せている時間（下限）
    holdAnsChar:    8,   // ＋回答1文字あたり
    /* ↓ 場面が切り替わるときの「間」。×1 のとき約1秒になるよう 660×PACE(1.5) で設定 */
    afterQuery:   660,   // 質問文を入力バーに戻してから「検索」を押すまで（約1.0秒）
    press:        660,   // 「検索」を押してから質問バブルが出るまで（約1.0秒）
    afterAsk:    1000,   // 質問バブルが出てからリポジトリの拡大表示まで（約1.5秒）
    afterRepos:   660,   // リポジトリの拡大表示から処理フローまで（約1.0秒）
    beforeAnswer:1334,   // 処理フローから回答の拡大表示まで（約2.0秒）
    citeStep:      90,
    fadeOut:      500
  };
  /* cycle 未指定のパターンの保持時間：下限 ＋ 回答1文字あたりの読む時間 */
  var HOLD_BASE = 1400;
  var HOLD_PER_CHAR = 8;
  var HOLD_MIN = 1100;

  /* ===== 全体の間の取り方（1.0で標準、大きくするほどゆっくり読ませる） =====
     拡大・縮小のアニメーション自体（spotIn / spotOut / fadeOut）は
     もたつかないよう等速のままにし、「見せている時間」だけを伸ばします。
     処理フロー（FLOW）はここでは変倍せず、常に一定の速さで再生します。 */
  var PACE = 1.5;
  ['startPause','holdQuery','holdRepos','holdAnsBase','holdAnsChar',
   'afterQuery','press','afterAsk','afterRepos','beforeAnswer','citeStep'].forEach(function (k) {
    SPEED[k] = Math.round(SPEED[k] * PACE);
  });
  /* 拡大表示（プロンプト／リポジトリ／回答）を消すまでの保持を一律で延長（ミリ秒） */
  var EXTRA_HOLD = 1000;
  SPEED.holdQuery += EXTRA_HOLD;
  SPEED.holdRepos += EXTRA_HOLD;
  SPEED.holdAnsBase += EXTRA_HOLD;

  HOLD_BASE = Math.round(HOLD_BASE * PACE);
  HOLD_PER_CHAR = HOLD_PER_CHAR * PACE;
  HOLD_MIN = Math.round(HOLD_MIN * PACE);
  PATTERNS.forEach(function (p) { if (p.cycle) p.cycle = Math.round(p.cycle * PACE); });

  var bar     = root.querySelector('.nrn-bar');
  var q       = root.querySelector('.nrn-q');
  var ask     = root.querySelector('.nrn-ask');
  var askT    = root.querySelector('.nrn-ask-t');
  var statusEl= root.querySelector('.nrn-status');
  var row1    = root.querySelector('.nrn-row1');
  var row2    = root.querySelector('.nrn-row2');
  var hitEl   = root.querySelector('.nrn-hit.nrn-num');
  var label   = root.querySelector('.nrn-ans-label');
  var stage   = root.querySelector('.nrn-stage');
  var card    = root.querySelector('.nrn-answer');
  var ansBody = root.querySelector('.nrn-ansbody');
  var ansEl   = root.querySelector('.nrn-ans-text');
  var citeBox = root.querySelector('.nrn-cites');
  var spot    = root.querySelector('.nrn-spot');
  var spotIn  = root.querySelector('.nrn-spot-inner');
  /* コントロール */
  var playBtn = root.querySelector('#nrnPlay');
  var trackEl = root.querySelector('#nrnTrack');
  var fillEl  = root.querySelector('#nrnFill');
  var knobEl  = root.querySelector('#nrnKnob');
  var timeEl  = root.querySelector('#nrnTime');
  var scnBox  = root.querySelector('#nrnScn');
  var spBox   = root.querySelector('#nrnSp');

  PATTERNS.forEach(function (p) {
    p.chars = p.answer.replace(/<[^>]*>/g, '').length;
  });

  /* ---- 拡大表示の中身 ---- */
  function bigQuery(p) {
    return '<div class="nrn-big nrn-big-query">' +
      '<svg class="nrn-big-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></svg>' +
      '<span>' + p.query + '</span></div>';

  /* 全体に大きく表示 → 定位置へ縮めて戻す */
  async function spotlight(html, target, hold, reveal, my) {
    var alive = function () { return my === token; };

    spot.classList.add('on');
    spotIn.style.transition = 'none';
    spotIn.style.transform = 'scale(.93)';
    spotIn.style.opacity = '0';

    spotIn.style.transition = 'transform ' + ms(SPEED.spotIn) + 'ms cubic-bezier(.2,.85,.3,1), opacity ' + ms(SPEED.spotIn) + 'ms ease';
    spotIn.style.transform = 'scale(1)';

  function reset(p) {

    row2.classList.remove('on');

  async function run(my) {
    var alive = function () { return my === token; };
    var p = PATTERNS[idx];
    elapsed = 0;
    var cs = reset(p);

    await sleep(SPEED.startPause);                 if (!alive()) return;

    /* 1) プロンプト：大きく見せてから検索バーへ */
    await spotlight(bigQuery(p), bar, SPEED.holdQuery, function () {

    }, my);                                        if (!alive()) return;

    root.classList.add('is-fading');
    await sleep(SPEED.fadeOut);                    if (!alive()) return;

  /* =========================================================

  var ICON_PLAY  = '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
  var ICON_PAUSE = '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';

  var FLOW_TOTAL = FLOW.fadeIn + FLOW.step * 7 + FLOW.sub + FLOW.no + FLOW.draw +

  function totalOf(p) {

      + SPEED.afterAsk
      + SPEED.spotIn + SPEED.holdRepos + SPEED.spotOut
      + SPEED.afterRepos

  function fmt(v) {

  }

  /* シナリオ選択ボタン */
  var scnBtns = [];
  PATTERNS.forEach(function (p, i) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'nrn-scn-b';
    b.title = p.query;
    b.innerHTML = '<span class="n">' + (i + 1) + '</span>' + (p.label || ('例' + (i + 1)));

  function ratioFrom(e) {

    fillEl.style.width = (r * 100) + '%';

  /* =========================================================

  var SCALE = 1;

    if (!holder) return;

    }, { threshold: 0.2 }).observe(root);
  } else { visible = true; start(); }

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') { if (!paused) stop(); }
    else if (visible) start();
  });
})();
</script>
